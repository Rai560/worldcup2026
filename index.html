const API="https://worldcup26.ir/get/games";

function flagURL(en){const t=TEAM[en];return t?("https://flagcdn.com/w80/"+t.flag+".png"):"";}
function zh(en){return (TEAM[en]&&TEAM[en].zh)||en;}

function kickoffMs(g){
  const m=(g.local_date||"").match(/(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})/);
  if(!m)return null;
  const off=(STAD[g.stadium_id]&&STAD[g.stadium_id].off);
  if(off===undefined)return null;
  return Date.UTC(+m[3],+m[1]-1,+m[2],+m[4],+m[5]) - off*3600000;
}
const WK=["周日","周一","周二","周三","周四","周五","周六"];
function bj(ms){return new Date(ms+8*3600000);}
function fmtTime(ms){const d=bj(ms);const p=n=>String(n).padStart(2,"0");
  return p(d.getUTCHours())+":"+p(d.getUTCMinutes());}
function fmtDay(ms){const d=bj(ms);return (d.getUTCMonth()+1)+"月"+d.getUTCDate()+"日 "+WK[d.getUTCDay()];}
function dayKey(ms){const d=bj(ms);return d.getUTCFullYear()+"-"+(d.getUTCMonth()+1)+"-"+d.getUTCDate();}

function countdown(ms){
  let s=Math.floor((ms-Date.now())/1000);if(s<0)return "";
  const d=Math.floor(s/86400);s-=d*86400;const h=Math.floor(s/3600);s-=h*3600;const mi=Math.floor(s/60);
  if(d>0)return d+"天"+h+"小时后";
  if(h>0)return h+"小时"+mi+"分后";
  return mi+"分钟后";
}
function status(g,ms){
  const fin=String(g.finished).toUpperCase()==="TRUE";
  if(fin)return "done";
  if(ms!==null && Date.now()>=ms && Date.now()<ms+2.5*3600000)return "live";
  if(ms!==null && Date.now()>=ms+2.5*3600000)return "done";
  return "soon";
}
function parseScorers(raw){
  if(!raw||raw==="null")return [];
  return raw.replace(/[{}]/g,"").replace(/[“”"]/g,"").split(",")
    .map(x=>x.trim()).filter(Boolean);
}

function formHtml(name){
  const f=ANALYSIS.FORM[name];
  if(!f||!f.length)return '<span style="color:var(--mut)">暂无</span>';
  const L={W:"胜",D:"平",L:"负"};
  return f.map(function(x){
    return '<span class="fdot f'+x.r+'" title="'+x.d+" "+zh(x.o)+" "+x.gf+"-"+x.ga+'">'+L[x.r]+'</span>';
  }).join("");
}
function h2hInfo(h,a){
  const key=[h,a].sort().join("|");
  const r=ANALYSIS.H2H[key];
  if(!r)return null;
  let hw,aw;
  if(r.A===h){hw=r.aw;aw=r.bw;}else{hw=r.bw;aw=r.aw;}
  const L=r.last;
  const lastTxt=L?(L.d.slice(0,4)+" "+zh(L.h)+" "+L.hs+"-"+L["as"]+" "+zh(L.a)):"—";
  return {n:r.n,hw:hw,aw:aw,dr:r.dr,lastTxt:lastTxt};
}
function analysisHtml(g){
  const eh=ANALYSIS.ELO[g.home_team_name_en], ea=ANALYSIS.ELO[g.away_team_name_en];

  const we=1/(1+Math.pow(10,(ea.elo-eh.elo)/400));
  const pd=0.28*2*Math.min(we,1-we);
  const hp=Math.round((we-0.5*pd)*100), dp=Math.round(pd*100), ap=100-hp-dp;
  const anId="an"+g.id, open=STATE.openAn.has(anId);
  const hz=zh(g.home_team_name_en), az=zh(g.away_team_name_en);
  const hh=h2hInfo(g.home_team_name_en,g.away_team_name_en);
  const h2hRow = hh
    ? '<div class="an-row"><span class="lab">历史交手</span>共'+hh.n+'次 · '+hz+' '+hh.hw+'胜'+hh.dr+'平'+hh.aw+'负<br><span class="lab">最近一次</span>'+hh.lastTxt+'</div>'
    : '<div class="an-row"><span class="lab">历史交手</span>两队此前无交锋记录</div>';
  return '<div class="analysis">'+
    '<div class="an-toggle" onclick="toggleAn(\''+anId+'\')">📊 对战分析 '+(open?"▴":"▾")+'</div>'+
    '<div class="an-body'+(open?" open":"")+'" id="'+anId+'">'+
      '<div class="bal-lbl"><span class="lh">'+hz+' 胜 '+hp+'%</span><span class="lm">平 '+dp+'%</span><span class="la">'+ap+'% '+az+' 胜</span></div>'+
      '<div class="bal"><div class="h" style="width:'+hp+'%"></div><div class="d" style="width:'+dp+'%"></div><div class="a" style="width:'+ap+'%"></div></div>'+
      '<div class="an-row"><span class="lab">实力 Elo</span>'+hz+' '+eh.elo+'(世界#'+eh.rank+') &nbsp;｜&nbsp; '+az+' '+ea.elo+'(#'+ea.rank+')</div>'+
      '<div class="an-row"><span class="lab">'+hz+' 近5</span>'+formHtml(g.home_team_name_en)+'</div>'+
      '<div class="an-row"><span class="lab">'+az+' 近5</span>'+formHtml(g.away_team_name_en)+'</div>'+
      h2hRow+
      '<div class="an-note">⚖ 胜/平/负为 Elo 评分推算（<b>非官方预测，仅供参考</b>）· 近5场=赛前最近5场（新→旧）· 数据源 martj42 历史库 + eloratings.net</div>'+
    '</div></div>';
}
function toggleAn(id){
  const b=document.getElementById(id);if(!b)return;
  const open=b.classList.toggle("open");
  if(open)STATE.openAn.add(id);else STATE.openAn.delete(id);
  const t=b.previousElementSibling;
  if(t&&t.classList.contains("an-toggle"))t.innerHTML="📊 对战分析 "+(open?"▴":"▾");
}

function card(g){
  const ms=kickoffMs(g);const st=status(g,ms);
  const sd=STAD[g.stadium_id]||{city:"",name:""};
  const hsc=parseScorers(g.home_scorers),asc=parseScorers(g.away_scorers);
  let tag = st==="live"?'<span class="tag-live">● 进行中</span>'
          : st==="done"?'<span class="tag-done">已结束</span>'
          : '<span class="tag-soon">'+(countdown(ms)||"待定")+'</span>';
  let scoreHtml = (st==="done"||st==="live")
    ? '<div class="score">'+(g.home_score||0)+' <span class="vs">-</span> '+(g.away_score||0)+'</div>'
    : '<div class="score pending">'+(ms?fmtTime(ms):"待定")+'</div>';
  let scorersHtml="";
  if((st==="done"||st==="live")&&(hsc.length||asc.length)){
    scorersHtml='<div class="scorers"><span class="s-side">⚽ '+(hsc.join("、")||"-")+
      '</span> &nbsp;|&nbsp; <span class="s-side">'+(asc.join("、")||"-")+' ⚽</span></div>';
  }
  return '<div class="card '+(st==="live"?"live":"")+'">'+
    '<div class="c-top"><span class="badge grp">'+(g.type==="group"?("小组 "+g.group):g.type)+
      '</span><span class="badge">第'+g.matchday+'轮</span>'+tag+
      '<span class="c-meta-r">'+(ms?fmtTime(ms):"")+'</span></div>'+
    '<div class="match">'+
      '<div class="team home"><img class="flag" loading="lazy" src="'+flagURL(g.home_team_name_en)+'" alt="">'+
        '<div class="tname">'+zh(g.home_team_name_en)+'<span class="en">'+g.home_team_name_en+'</span></div></div>'+
      scoreHtml+
      '<div class="team away"><img class="flag" loading="lazy" src="'+flagURL(g.away_team_name_en)+'" alt="">'+
        '<div class="tname">'+zh(g.away_team_name_en)+'<span class="en">'+g.away_team_name_en+'</span></div></div>'+
    '</div>'+ scorersHtml +
    '<div class="c-bot">📍 '+sd.city+' · '+sd.name+'</div>'+
    analysisHtml(g)+
  '</div>';
}

/* ===== 冠军预测（实时演进）v3 ===== */
const PRED={open:false,S:300,TOPN:8};
function tflag(en){return '<img class="ph-flag" loading="lazy" src="'+flagURL(en)+'">';}
function eloDelta(eh,ea,hg,ag){
  const we=1/(1+Math.pow(10,(ea-eh)/400));
  const W=hg>ag?1:(hg===ag?0.5:0);
  const gd=Math.abs(hg-ag);
  let G=1;
  if(gd===2)G=1.5;else if(gd===3)G=1.75;else if(gd>=4)G=1.75+(gd-3)/8;
  return 60*G*(W-we);
}
function computePrediction(){
  const base={},live={};
  for(const k in ANALYSIS.ELO){base[k]=ANALYSIS.ELO[k].elo;live[k]=ANALYSIS.ELO[k].elo;}
  const fin=STATE.games.map(function(g){return {g:g,ms:kickoffMs(g)};})
    .filter(function(x){var g=x.g;
      return status(g,x.ms)==="done" && g.home_score!=null && g.away_score!=null
        && !isNaN(+g.home_score) && !isNaN(+g.away_score)
        && ANALYSIS.ELO[g.home_team_name_en] && ANALYSIS.ELO[g.away_team_name_en];})
    .sort(function(a,b){return (a.ms||0)-(b.ms||0);});
  const history=[];
  let prevTop=null,prevLeader=null;
  fin.forEach(function(x,idx){
    const g=x.g,h=g.home_team_name_en,a=g.away_team_name_en;
    const hg=+g.home_score,ag=+g.away_score;
    const eh=live[h],ea=live[a];
    const W=hg>ag?1:(hg===ag?0.5:0);
    const delta=eloDelta(eh,ea,hg,ag);
    live[h]=eh+delta;live[a]=ea-delta;
    const ranked=Object.keys(live).sort(function(p,q){return live[q]-live[p];});
    const topN=ranked.slice(0,PRED.TOPN),leader=ranked[0];
    let upset=false,winner=null,loser=null;
    if(W!==0.5){
      if(W===1){winner=h;loser=a;}else{winner=a;loser=h;}
      const gap=(W===1?ea-eh:eh-ea);
      if(gap>=80)upset=true;
    }
    let reason=null;
    if(idx===0)reason="opener";
    else if(leader!==prevLeader)reason="leader";
    else{
      const enter=topN.filter(function(t){return prevTop.indexOf(t)<0;});
      const exit=prevTop.filter(function(t){return topN.indexOf(t)<0;});
      if(enter.length||exit.length)reason="topset";
      else if(upset)reason="upset";
    }
    if(reason){
      const d=bj(x.ms),dateTxt=(d.getUTCMonth()+1)+"/"+d.getUTCDate();
      const matchLine=tflag(h)+zh(h)+" "+hg+"-"+ag+" "+tflag(a)+zh(a);
      const dR=Math.round(Math.abs(delta));
      let impact="";
      if(reason==="opener"){impact="本届揭幕战 · 预测榜首 "+tflag(leader)+zh(leader);}
      else if(reason==="leader"){impact=tflag(leader)+"<b>"+zh(leader)+" 登顶预测榜</b>（超越 "+zh(prevLeader)+"）";}
      else if(reason==="topset"){
        const enter=topN.filter(function(t){return prevTop.indexOf(t)<0;});
        const exit=prevTop.filter(function(t){return topN.indexOf(t)<0;});
        const parts=[];
        enter.forEach(function(t){parts.push(tflag(t)+zh(t)+" 跻身夺冠前8");});
        exit.forEach(function(t){parts.push(zh(t)+" 跌出前8");});
        impact=parts.join("，");
      } else {impact="<b>"+zh(winner)+"</b> 爆冷胜 "+zh(loser)+"，"+zh(winner)+" Elo +"+dR;}
      const prefix=upset?"⚡ ":"";
      history.push('<div class="ph-item'+(upset?" up":"")+'"><span class="ph-date">'+dateTxt+
        '</span><span class="ph-txt">'+prefix+matchLine+"｜"+impact+"</span></div>");
    }
    prevTop=topN;prevLeader=leader;
  });
  return {live:live,base:base,finCount:fin.length,history:history};
}
function renderPredict(){
  const el=document.getElementById("predict");
  if(!el)return;
  if(!STATE.ok||!ANALYSIS||!ANALYSIS.ELO){el.innerHTML="";return;}
  const P=computePrediction(),live=P.live,S=PRED.S;
  const names=Object.keys(live),w={};let tot=0;
  names.forEach(function(n){var x=Math.pow(10,live[n]/S);w[n]=x;tot+=x;});
  const ranked=names.sort(function(a,b){return live[b]-live[a];});
  const top=ranked.slice(0,PRED.TOPN),leaderPct=w[top[0]]/tot*100;
  const rows=top.map(function(n,i){
    const pct=w[n]/tot*100,chg=Math.round(live[n]-P.base[n]);
    const chgHtml=chg>0?'<span class="pr-up">↑'+chg+'</span>':(chg<0?'<span class="pr-dn">↓'+(-chg)+'</span>':'<span class="pr-flat">–</span>');
    const barW=(pct/leaderPct*100).toFixed(0);
    return '<div class="pr-row"><span class="pr-rk r'+(i+1)+'">'+(i+1)+'</span>'+
      '<img class="pr-flag" loading="lazy" src="'+flagURL(n)+'">'+
      '<span class="pr-name">'+zh(n)+'</span>'+
      '<span class="pr-bar"><span style="width:'+barW+'%"></span></span>'+
      '<span class="pr-pct">'+pct.toFixed(0)+'%</span>'+
      '<span class="pr-elo">'+Math.round(live[n])+' '+chgHtml+'</span></div>';
  }).join("");
  let hist=P.history.slice().reverse().join("");
  const baseTop=Object.keys(P.base).sort(function(a,b){return P.base[b]-P.base[a];}).slice(0,3).map(zh).join(" · ");
  hist+='<div class="ph-item ph-base"><span class="ph-date">赛前</span><span class="ph-txt">基准实力榜：'+baseTop+' 领跑</span></div>';
  el.innerHTML='<div class="pred-card"><div class="pred-toggle" onclick="togglePred()">'+
    '<span>📈 冠军预测 · 实时演进</span>'+
    '<span class="pred-leader">领跑 <img class="pr-flag tiny" loading="lazy" src="'+flagURL(top[0])+'">'+zh(top[0])+'</span>'+
    '<span class="pred-caret">'+(PRED.open?"▴":"▾")+'</span></div>'+
    '<div class="pred-body'+(PRED.open?" open":"")+'">'+
    '<div class="pred-sub">截至 '+P.finCount+' 场已结束 · 每场赛后自动重算 · ⚠️ 非官方估算（按 Elo 实力·中性场地推算），仅供参考</div>'+
    '<div class="pred-rank">'+rows+'</div>'+
    '<div class="pred-hist-hdr">📜 预测演进史 <span class="phh-sub">（仅记录榜首易主 / 冷门 / 热门圈变动）</span></div>'+
    '<div class="pred-hist">'+hist+'</div>'+
    '<div class="an-note">夺冠热度＝按当前 Elo 实力的相对占比（48 队归一化，未剔除已淘汰队，小组赛后更准）· Elo 复盘采用 eloratings.net 世界杯算法（K=60），与官方发布值可能有微小差异 · 仅供娱乐参考</div>'+
    '</div></div>';
}
function togglePred(){PRED.open=!PRED.open;renderPredict();}
/* ===== 小组积分榜 + 出线形势 v4 ===== */
const GRP={open:false};
function computeGroups(){
  const G={};
  STATE.games.forEach(function(g){
    if(g.type!=="group"||!g.group)return;
    const L=g.group,h=g.home_team_name_en,a=g.away_team_name_en;
    if(!ANALYSIS.ELO[h]||!ANALYSIS.ELO[a])return;
    if(!G[L])G[L]={};
    if(!G[L][h])G[L][h]={t:h,p:0,w:0,d:0,l:0,gf:0,ga:0};
    if(!G[L][a])G[L][a]={t:a,p:0,w:0,d:0,l:0,gf:0,ga:0};
    const ms=kickoffMs(g);
    if(status(g,ms)==="done"&&g.home_score!=null&&g.away_score!=null&&!isNaN(+g.home_score)&&!isNaN(+g.away_score)){
      const hg=+g.home_score,ag=+g.away_score,H=G[L][h],A=G[L][a];
      H.p++;A.p++;H.gf+=hg;H.ga+=ag;A.gf+=ag;A.ga+=hg;
      if(hg>ag){H.w++;A.l++;}else if(hg<ag){A.w++;H.l++;}else{H.d++;A.d++;}
    }
  });
  return G;
}
function sortTbl(arr){
  arr.forEach(function(s){s.pts=s.w*3+s.d;s.gd=s.gf-s.ga;});
  return arr.sort(function(a,b){return (b.pts-a.pts)||(b.gd-a.gd)||(b.gf-a.gf)||(a.t<b.t?-1:1);});
}
function renderGroups(){
  const el=document.getElementById("groups");
  if(!el)return;
  if(!STATE.ok||!ANALYSIS||!ANALYSIS.ELO){el.innerHTML="";return;}
  const G=computeGroups(),letters=Object.keys(G).sort();
  if(!letters.length){el.innerHTML="";return;}
  const standings={},thirds=[];
  letters.forEach(function(L){
    const arr=sortTbl(Object.keys(G[L]).map(function(k){return G[L][k];}));
    standings[L]=arr;
    if(arr[2])thirds.push(Object.assign({grp:L},arr[2]));
  });
  const thirdsRanked=thirds.slice().sort(function(a,b){return (b.pts-a.pts)||(b.gd-a.gd)||(b.gf-a.gf)||(a.t<b.t?-1:1);});
  const advThirds={};
  thirdsRanked.slice(0,8).forEach(function(x){advThirds[x.grp]=true;});
  let blocks="";
  letters.forEach(function(L){
    const arr=standings[L],started=arr.some(function(x){return x.p>0;});
    let rows='<div class="gr-head"><span class="gr-pos">#</span><span></span><span>球队</span><span class="gr-c">场</span><span class="gr-wdl">胜平负</span><span class="gr-c">净</span><span class="gr-c">分</span></div>';
    arr.forEach(function(s,i){
      let cls="gr-row",isAdv=false;
      if(started){
        if(i<2){cls+=" adv";isAdv=true;}
        else if(i===2&&advThirds[L]){cls+=" adv";isAdv=true;}
        else if(i===2){cls+=" maybe";}
      }
      const chk=isAdv?'<span class="gr-check">✓</span>':'';
      rows+='<div class="'+cls+'"><span class="gr-pos">'+(i+1)+'</span>'+
        '<img class="gr-flag" loading="lazy" src="'+flagURL(s.t)+'">'+
        '<span class="gr-name">'+zh(s.t)+chk+'</span>'+
        '<span class="gr-c">'+s.p+'</span>'+
        '<span class="gr-wdl">'+s.w+'-'+s.d+'-'+s.l+'</span>'+
        '<span class="gr-c">'+(s.gd>0?"+":"")+s.gd+'</span>'+
        '<span class="gr-pts">'+s.pts+'</span></div>';
    });
    blocks+='<div class="grp-block"><div class="grp-name">小组 '+L+(started?"":' <span class="grp-tag">· 未开赛</span>')+'</div>'+rows+'</div>';
  });
  let tr='<div class="thirds"><div class="thirds-hdr">🔢 最佳第3名排名（前8出线）</div>';
  thirdsRanked.forEach(function(x,i){
    const adv=i<8;
    tr+='<div class="third-row'+(adv?" adv":" cut")+'"><span class="third-rk">'+(i+1)+'</span>'+
      '<img class="gr-flag" loading="lazy" src="'+flagURL(x.t)+'">'+
      '<span>'+zh(x.t)+'（'+x.grp+'组）'+(x.p>0?" "+x.pts+"分 "+(x.gd>0?"+":"")+x.gd:" 未赛")+'</span>'+(adv?'<span class="gr-check">✓</span>':'')+'</div>';
  });
  tr+='</div>';
  el.innerHTML='<div class="grp-card"><div class="grp-toggle" onclick="toggleGrp()">'+
    '<span>📋 小组积分榜 · 出线形势</span><span class="grp-caret">'+(GRP.open?"▴":"▾")+'</span></div>'+
    '<div class="grp-body'+(GRP.open?" open":"")+'">'+
    '<div class="grp-sub">每组前 2 直接出线，外加 12 组中成绩最好的 8 个第 3 名，共 <b>32 队</b>晋级 · <span style="color:var(--grn)">绿色＝当前出线区</span>（按现有战绩，若此刻结束）· 实时按比分更新</div>'+
    blocks+tr+
    '</div></div>';
}
function toggleGrp(){GRP.open=!GRP.open;renderGroups();}
function render(){
  renderPredict();
  renderGroups();
  const all=STATE.games.map(g=>({g,ms:kickoffMs(g),st:status(g,kickoffMs(g))}));
  const counts={soon:0,live:0,done:0,all:all.length};
  all.forEach(x=>{if(x.st!=="all")counts[x.st]++});
  const tabsDef=[["soon","即将开始",counts.soon],["live","进行中",counts.live],
    ["done","已结束",counts.done],["all","全部赛程",counts.all]];
  document.getElementById("tabs").innerHTML=tabsDef.map(t=>
    '<div class="tab '+(STATE.tab===t[0]?"on":"")+'" onclick="setTab(\''+t[0]+'\')">'+
    t[1]+'<span class="n">'+t[2]+'</span></div>').join("");

  let items;
  if(STATE.tab==="all") items=all.slice();
  else items=all.filter(x=>x.st===STATE.tab);
  items.sort((a,b)=>(a.ms||0)-(b.ms||0));
  if(STATE.tab==="done") items.reverse();

  const list=document.getElementById("list");
  if(!items.length){
    const msg={soon:"暂无即将开始的比赛",live:"当前没有进行中的比赛",
      done:"还没有已结束的比赛",all:"暂无赛程数据"}[STATE.tab];
    list.innerHTML='<div class="empty">'+msg+'</div>';return;
  }
  let html="",curday=null;
  items.forEach(x=>{
    const dk=x.ms?dayKey(x.ms):"待定";
    if(dk!==curday){curday=dk;
      const label=x.ms?fmtDay(x.ms):"日期待定";
      html+='<div class="dayhdr">'+label+'<span class="line"></span></div>';
    }
    html+=card(x.g);
  });
  list.innerHTML=html;
}
function setTab(t){STATE.tab=t;render();}

async function load(manual){
  const err=document.getElementById("err");
  try{
    const r=await fetch(API,{cache:"no-store"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const j=await r.json();
    STATE.games=j.games||j.data||[];
    STATE.ok=true;err.style.display="none";
    const now=bj(Date.now());const p=n=>String(n).padStart(2,"0");
    document.getElementById("updated").textContent="更新于 "+p(now.getUTCHours())+":"+p(now.getUTCMinutes())+":"+p(now.getUTCSeconds());
    render();
  }catch(e){
    err.style.display="block";
    err.innerHTML="⚠ 数据拉取失败："+e.message+
      "（可能是网络/数据源临时不可用，已保留上次数据。可点刷新重试）";
    if(!STATE.games.length)
      document.getElementById("list").innerHTML='<div class="empty">无法连接数据源 😕<br>请检查网络后点右上角刷新</div>';
  }
}
load();
setInterval(load,60000);
setInterval(()=>{if(STATE.tab==="soon"||STATE.tab==="all")render();},30000);
</script>
